# agentree on a machine: one daemon for every project under one directory of the host.
#
#   AGENTREE_PROJECTS=/absolute/path/of/your/projects docker compose up --detach
#
# The directory is mounted at the same absolute path, so that a path means one place to the daemon, to the
# containers it starts for a project's commands, and to the tools on the host.
services:
  agentree:
    build: .
    container_name: agentree
    restart: unless-stopped
    # The daemon's port is published on the loopback address only: whatever reaches it can start a container.
    ports:
      - "127.0.0.1:${AGENTREE_PORT:-4517}:4517"
    volumes:
      - ${AGENTREE_PROJECTS:?name the directory of your projects, as an absolute path}:${AGENTREE_PROJECTS}
      - agentree-home:/var/lib/agentree
      # The daemon starts a project's commands as containers of the project's image.
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: ${AGENTREE_PROJECTS}
    environment:
      # The browser `agentree compare` reads a page with: the container below, at the daemon's own loopback address.
      AGENTREE_BROWSER: ws://127.0.0.1:3000/

  # The browser of the comparisons. The daemon's image is Alpine's, where Playwright's browsers do not run; this one
  # shares the daemon's network, so that a page the daemon serves at its loopback address is the same page here.
  # Its version is the version of `playwright` in package.json: a server answers only a client of its own version.
  browser:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    restart: unless-stopped
    network_mode: service:agentree
    init: true
    ipc: host
    user: pwuser
    working_dir: /home/pwuser
    command: npx -y playwright@1.65.1 run-server --port 3000 --host 127.0.0.1

volumes:
  # The machine's list of projects, its token and its queue.
  agentree-home:
